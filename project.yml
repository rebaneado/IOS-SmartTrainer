name: SmartTrainer
options:
  bundleIdPrefix: com.rebaneado
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # fill in your Apple Developer Team ID in Xcode
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  SmartTrainer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SmartTrainer
    info:
      path: SmartTrainer/Info.plist
      properties:
        CFBundleDisplayName: SmartTrainer
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # CoreBluetooth requires a usage description or the app is rejected/crashes.
        NSBluetoothAlwaysUsageDescription: >-
          SmartTrainer connects to your smart trainer and optional heart rate
          strap over Bluetooth to control resistance and record your ride.
        UIBackgroundModes:
          - bluetooth-central
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rebaneado.smarttrainer
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2" # 1 = iPhone, 2 = iPad
        SUPPORTS_MACCATALYST: NO

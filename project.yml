name: SmartTrainer
options:
  bundleIdPrefix: com.rebaneado
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ULU63PMMHC
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  SmartTrainer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SmartTrainer
    info:
      path: SmartTrainer/Info.plist
      properties:
        CFBundleDisplayName: SmartTrainer
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The app uses only Apple's standard HTTPS and Bluetooth APIs. Declaring
        # this avoids an unnecessary export-compliance question for each build.
        ITSAppUsesNonExemptEncryption: false
        # Both values are public OAuth configuration. The Strava Client Secret
        # stays only in the Cloudflare Worker secret store and never ships here.
        StravaClientID: "272801"
        StravaTokenProxyURL: "https://ios-smarttrainer.rebaneado-smarttrainer.workers.dev"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # CoreBluetooth requires a usage description or the app is rejected/crashes.
        NSBluetoothAlwaysUsageDescription: >-
          SmartTrainer connects to your smart trainer and optional heart rate
          strap over Bluetooth to control resistance and record your ride.
        UIBackgroundModes:
          - bluetooth-central
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Redirect target for Strava's OAuth sign-in (ASWebAuthenticationSession).
        CFBundleURLTypes:
          - CFBundleURLName: com.rebaneado.smarttrainer.strava
            CFBundleURLSchemes:
              - smarttrainer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rebaneado.smarttrainer
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2" # 1 = iPhone, 2 = iPad
        SUPPORTS_MACCATALYST: NO
